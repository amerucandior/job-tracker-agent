    "msal>=1.39.0",
    "notion-client>=3.1.0",
    "pydantic>=2.14.3",
    "pytest>=9.2.0",
    "requests>=2.34.2",
    "rich>=15.0.0",
    "tomli-w>=1.2.0",
    "typer>=0.28.0",
]
